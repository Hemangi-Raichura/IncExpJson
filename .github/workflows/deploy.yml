name: Deploy to GitHub Pages
on:
  push:
    branches: [main] # Every time you push to main, the robot works
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false # <--- This tells the robot to ignore the ghost submodule
      - name: Install and Build
        run: |
          npm install
          npm run build
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # The folder the robot should pick up
          branch: gh-pages # The special hidden branch for your site